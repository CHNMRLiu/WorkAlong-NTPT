# 长泵能碳管理系统 (WorkBuddy-NTPT) —— Docker 编排
#
# 说明：本机 5432 / 8000 / 80 端口已被其他服务占用，故宿主机侧使用 15432 / 18000 / 18080。
# 容器间通过内部网络（db / backend / frontend）通信，不依赖宿主机端口，因此无需改动。
# 如需标准端口，将左侧宿主机端口改回 5432/8000/80 并释放占用端口即可。
#
#   db:       15432 → 5432
#   backend:  18000 → 8000   (API / Swagger)
#   frontend: 18080 → 80     (Web)

services:
  db:
    image: postgres:15
    container_name: energy_carbon_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: energy_carbon
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy_carbon"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: energy_carbon_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/energy_carbon
      # 生产环境请通过环境变量覆盖为强随机密钥
      SECRET_KEY: energy-carbon-system-2026-dev-secret-change-me
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: energy_carbon_frontend
    depends_on:
      - backend
    ports:
      - "18080:80"
    restart: unless-stopped

volumes:
  pgdata:
